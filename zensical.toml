[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
attr_list = {}
md_in_html = {}
pymdownx.blocks.caption = {}
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.tabbed.alternate_style = true

[project.plugins.search]
lang = "en"

[project.plugins.glightbox]

[project.theme]
variant = "classic"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.expand",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
]
icon.repo = "fontawesome/brands/github"
icon.logo = "material/cube"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/t6Cft3wNJ3"