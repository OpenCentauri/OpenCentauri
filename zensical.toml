  { "AMS Support" = "klipper-conversion/cosmos/ams.md" },
  { "Troubleshooting" = [
    "klipper-conversion/cosmos/troubleshooting/index.md",
    { "Bed issues" = "klipper-conversion/cosmos/troubleshooting/bed.md" },
    { "Printing and slicer issues" = "klipper-conversion/cosmos/troubleshooting/printing.md" },
    { "Stability and memory" = "klipper-conversion/cosmos/troubleshooting/stability.md" },
